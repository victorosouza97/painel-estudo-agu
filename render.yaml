services:
  - type: web
    name: painel-estudo-agu
    runtime: node
    plan: free
    buildCommand: "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install --include=dev && npx prisma generate && npm run build"
    startCommand: "cd backend && npx prisma migrate deploy && node dist/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD_HASH
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
